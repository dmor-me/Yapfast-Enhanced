[package]
name = "yapfast-enhanced-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

tempfile = "3"

[profile.release]
opt-level = 2
codegen-units = 16
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
