[package]
name = "yapfast-enhanced-loader"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[lib]
name = "yapfast_enhanced_module"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "yapfast-enhanced-loader"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
yapfast-plugin-api = { path = "../../crates/yapfast-plugin-api" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 2
strip = true
