name: Feature request
description: Suggest an improvement to Enhanced
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-facing behavior and any memory or compatibility tradeoffs.
    validations:
      required: true
